name: Task
description: Technical work with no directly visible user-facing change
title: "[Task] "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this for refactors, upgrades, migrations, tooling, spikes, and
        chores. If a user would notice the change, file a Feature instead.

  - type: textarea
    id: details
    attributes:
      label: Details
      description: >
        Fill in each heading. Why is the cost of not doing it — tasks without
        this line tend to sit in the backlog until they become incidents.
        Definition of done is a checklist.
      value: |
        #### What needs doing

        #### Why

        #### Definition of done

        - [ ]

    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      multiple: true
      options:
        - Mobile app
        - Web
        - Admin console
        - Backend / API
        - Infrastructure
        - Cross-cutting
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: >
        What could break, and how we undo it. Required for migrations and
        dependency upgrades; leave blank for low-risk chores.
    validations:
      required: false
