name: Epic
description: A body of work spanning multiple features, usually more than one sprint
title: "[Epic] "
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Epics group related work. Keep this issue short — the detail belongs in
        the Features and Tasks underneath it.

  - type: textarea
    id: details
    attributes:
      label: Details
      description: >
        Fill in each heading. Outcome is the end state for users, not the work
        (e.g. "Collectors can claim a free daily reward without leaving the
        collection screen"). Why now is the problem this solves and what happens
        if we don't do it. Naming what is out of scope stops the epic growing
        during delivery. Success measures should be numbers over adjectives
        (e.g. "30% of daily active collectors claim within the first week").
      value: |
        #### Outcome

        #### Why now

        #### In scope / Out of scope

        **In scope**
        -

        **Out of scope**
        -

        #### Success measures

    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: Breakdown
      description: Child issues. Leave blank if they don't exist yet — link them as they are created.
      value: |
        - [ ] #
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
      description: Anything outside this epic that could block it — other teams, vendors, migrations, approvals.
    validations:
      required: false
