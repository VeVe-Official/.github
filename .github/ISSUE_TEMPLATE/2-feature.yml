name: Feature
description: A request, idea, or new functionality
title: "[Feature] "
type: Feature
body:
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >
        Fill in each heading. User story: who wants this, what they want to do,
        and why. Problem: what is painful or impossible today — the current
        behaviour, not the solution. Acceptance criteria: testable statements a
        reviewer can check without asking the author what was meant.
      value: |
        #### User story

        As a <role>
        I want <capability>
        So that <benefit>

        #### Problem

        #### Acceptance criteria

        - [ ] Given <context>, when <action>, then <result>
        - [ ]

    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Where the change is visible. Pick every surface that needs work.
      multiple: true
      options:
        - Mobile app
        - Web
        - Admin console
        - Backend / API
        - Infrastructure
        - Not sure
    validations:
      required: false

  - type: textarea
    id: design
    attributes:
      label: Designs and references
      description: Figma links, specs, prior discussion, related issues.
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Anything deliberately excluded, so it is not raised during review as a gap.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues, services, teams, or third parties this needs first.
    validations:
      required: false
