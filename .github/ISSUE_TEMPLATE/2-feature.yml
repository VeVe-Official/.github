name: Feature
description: A request, idea, or new functionality
title: "[Feature] "
type: Feature
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who wants this, what they want to do, and why.
      value: |
        As a <role>
        I want <capability>
        So that <benefit>
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or impossible today. Describe the current behaviour, not the solution.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Testable statements. A reviewer should be able to check each one without
        asking the author what was meant.
      value: |
        - [ ] Given <context>, when <action>, then <result>
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Where the change is visible. Pick every surface that needs work.
      multiple: true
      options:
        - Mobile app
        - Web
        - Admin console
        - Backend / API
        - Infrastructure
        - Not sure
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Designs and references
      description: Figma links, specs, prior discussion, related issues.
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Anything deliberately excluded, so it is not raised during review as a gap.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues, services, teams, or third parties this needs first.
    validations:
      required: false
